name: Publish pnpm policy
on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: Validate the package without publishing
        type: boolean
        default: true
permissions:
  contents: read
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          package_json_file: packages/pnpm-policy/package.json
      - run: node --test test/pnpm-policy.test.mjs
      - name: Publish
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          PNPM_CONFIG_PROVENANCE: true
        working-directory: packages/pnpm-policy
        run: |
          args=(--access public)
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          pnpm publish "${args[@]}"
