name: pnpm policy
on:
  workflow_call:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: packages/pnpm-policy/package.json
      - run: node --test test/pnpm-policy.test.mjs
      - uses: ./.github/actions/pnpm-policy
        with:
          working-directory: packages/pnpm-policy
      - run: pnpm --dir packages/pnpm-policy publish --dry-run --access public --no-git-checks
