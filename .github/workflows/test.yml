name: Test
on:
  push:
    branches:
      - main
  pull_request:

env:
  LOG_LEVEL: debug

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  preset:
    name: Preset validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Run tests
        run: npx --yes --package=renovate@44.232.1 --call './test/run.sh'

  policy:
    uses: ./.github/workflows/pnpm-policy.yml

  required-checks-pass:
    name: Required checks pass
    if: always()
    needs:
      - preset
      - policy
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify required jobs
        env:
          PRESET_RESULT: ${{ needs.preset.result }}
          POLICY_RESULT: ${{ needs.policy.result }}
        run: |
          if [[ "$PRESET_RESULT" != "success" || "$POLICY_RESULT" != "success" ]]; then
            echo "::error::Preset validation: $PRESET_RESULT; pnpm policy: $POLICY_RESULT"
            exit 1
          fi
